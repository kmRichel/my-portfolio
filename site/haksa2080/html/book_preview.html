<script>
    function goto_page() {
        var total_view_page = $("#total_view_page").val();
        var now_view_page = $("#now_view_page").val();

        if (now_view_page == "") {
            alert("이동할 페이지 번호를 입력하세요.");
            $("#now_view_page").focus();
            return;
        }

        if ( parseInt(now_view_page) > parseInt(total_view_page) ) {
            alert("잘못된 페이지 번호 입니다.");
            return;
        }

        ch_page = now_view_page % 2 ;

        if (ch_page == "0") {
            page = now_view_page - 1;
        } else {
            page = now_view_page;
        }

        window.location.href = "/site/book/book_preview.php?book_id=<?=$book_id?>&page=" + page;
    }

</script>
